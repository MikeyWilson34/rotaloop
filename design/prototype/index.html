<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotaloop Prototype</title>
<meta name="description" content="Clickable prototype of a mobile app for sharing recurring responsibilities fairly across a group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (mirror design/design-system.md) ===== */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-alt:#F3EEE6; --border:#E8E1D6; --border-strong:#D8CFC1;
  --text:#1F2D45; --text-2:#5F6673; --text-3:#686E79;
  --navy:#1F2D45; --on-navy:#FFFFFF; --on-navy-2:#C7D0DD; --navy-raise:#2E3E5A;
  --primary:#3A6894; --on-primary:#FFFFFF; --primary-tint:#E5EDF5;
  --success:#4E7D5B; --on-success:#FFFFFF; --success-text:#3D6B4A; --success-tint:#E4EEE6;
  --warning:#C98A2B; --warning-text:#8A5A0F; --warning-tint:#FBEED6;
  --danger:#A9483F; --on-danger:#FFFFFF; --danger-text:#9C3F37; --danger-tint:#F7E2DE;
  --neutral-tint:#ECEAE6;
  --hero-confirm:#86BC95; --on-hero-confirm:#10213A; --hero-amber:#F2C46D; --hero-sage:#A9D4B3; --hero-red:#F2A196;
  --shadow-1:0 1px 2px rgba(31,45,69,.06),0 2px 8px rgba(31,45,69,.05);
  --shadow-2:0 4px 12px rgba(31,45,69,.08),0 12px 32px rgba(31,45,69,.10);
  --shadow-3:0 -8px 32px rgba(31,45,69,.16);
  --card-border:transparent;
  --scrim:rgba(17,22,31,.45);
  --stage:#EAE3D8; --stage-text:#1F2D45; --stage-2:#5F6673; --ctl-on:#FFFFFF; --chip-on:#1F2D45; --on-chip-on:#FFFFFF;
  --acc-blue:#3A6894; --acc-blue-t:#E5EDF5; --acc-plum:#7A5A8C; --acc-plum-t:#EFE7F3;
  --acc-clay:#A0603E; --acc-clay-t:#F6E8DF; --acc-teal:#2F7C7A; --acc-teal-t:#DFF0EE;
  --av-s:45%; --av-l:88%; --av-fs:38%; --av-fl:30%;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161F; --surface:#1A212C; --surface-alt:#232C3A; --border:#2C3646; --border-strong:#3B475A;
    --text:#EEF1F6; --text-2:#A7B0BE; --text-3:#7F8999;
    --navy:#22324D; --on-navy:#FFFFFF; --on-navy-2:#C7D0DD; --navy-raise:#2F4363;
    --primary:#86AEDB; --on-primary:#0F1A2A; --primary-tint:#1F2E42;
    --success:#93C4A0; --on-success:#0F1A2A; --success-text:#93C4A0; --success-tint:#1E3326;
    --warning:#E6B567; --warning-text:#E6B567; --warning-tint:#3A2E17;
    --danger:#EE958B; --on-danger:#0F1A2A; --danger-text:#EE958B; --danger-tint:#3D2220;
    --neutral-tint:#262D38;
    --shadow-1:none; --shadow-2:0 8px 24px rgba(0,0,0,.35); --shadow-3:0 -8px 32px rgba(0,0,0,.5);
    --card-border:#2C3646; --scrim:rgba(0,0,0,.55);
    --stage:#0B0F15; --stage-text:#EEF1F6; --stage-2:#A7B0BE; --ctl-on:#2C3646; --chip-on:#86AEDB; --on-chip-on:#0F1A2A;
    --acc-blue:#86AEDB; --acc-blue-t:#1F2E42; --acc-plum:#C3A6D3; --acc-plum-t:#2E2436;
    --acc-clay:#E3A88A; --acc-clay-t:#382820; --acc-teal:#86CBC8; --acc-teal-t:#1A3332;
    --av-s:25%; --av-l:27%; --av-fs:55%; --av-fl:82%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A212C; --surface-alt:#232C3A; --border:#2C3646; --border-strong:#3B475A;
  --text:#EEF1F6; --text-2:#A7B0BE; --text-3:#7F8999;
  --navy:#22324D; --on-navy:#FFFFFF; --on-navy-2:#C7D0DD; --navy-raise:#2F4363;
  --primary:#86AEDB; --on-primary:#0F1A2A; --primary-tint:#1F2E42;
  --success:#93C4A0; --on-success:#0F1A2A; --success-text:#93C4A0; --success-tint:#1E3326;
  --warning:#E6B567; --warning-text:#E6B567; --warning-tint:#3A2E17;
  --danger:#EE958B; --on-danger:#0F1A2A; --danger-text:#EE958B; --danger-tint:#3D2220;
  --neutral-tint:#262D38;
  --shadow-1:none; --shadow-2:0 8px 24px rgba(0,0,0,.35); --shadow-3:0 -8px 32px rgba(0,0,0,.5);
  --card-border:#2C3646; --scrim:rgba(0,0,0,.55);
  --stage:#0B0F15; --stage-text:#EEF1F6; --stage-2:#A7B0BE; --ctl-on:#2C3646; --chip-on:#86AEDB; --on-chip-on:#0F1A2A;
  --acc-blue:#86AEDB; --acc-blue-t:#1F2E42; --acc-plum:#C3A6D3; --acc-plum-t:#2E2436;
  --acc-clay:#E3A88A; --acc-clay-t:#382820; --acc-teal:#86CBC8; --acc-teal-t:#1A3332;
  --av-s:25%; --av-l:27%; --av-fs:55%; --av-fl:82%;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--text);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{display:block;flex:none}

/* ===== Stage / phone frame ===== */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px 24px}
.controls{width:280px;color:var(--stage-text);display:flex;flex-direction:column;gap:20px}
.controls h1{font-size:22px;line-height:28px;margin:0;font-weight:800;display:flex;align-items:center;gap:10px}
.controls .logo{width:36px;height:36px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center}
.controls p{margin:0;color:var(--stage-2);font-size:14px;line-height:20px}
.ctl-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-2);margin-bottom:6px}
.ctl-seg{display:flex;background:color-mix(in srgb,var(--stage-text) 8%,transparent);border-radius:12px;padding:3px;gap:2px}
.ctl-seg button{flex:1;min-height:40px;border-radius:9px;font-size:13px;font-weight:700;text-align:center;color:var(--stage-2);padding:0 8px}
.ctl-seg button[aria-pressed="true"]{background:var(--ctl-on);color:var(--text);box-shadow:var(--shadow-1)}
.ctl-reset{font-size:13px;font-weight:700;color:var(--stage-2);text-decoration:underline;align-self:flex-start;min-height:32px}
.phone{width:390px;height:844px;flex:none;border-radius:56px;padding:11px;background:#0E1219;box-shadow:0 30px 80px rgba(20,25,35,.35),inset 0 0 0 2px #2A303B}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:800;color:var(--text);position:relative;z-index:6;background:var(--bg)}
.statusbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#0E1219}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
@media (max-width:760px){
  .stage{display:block;padding:0;min-height:0;height:100dvh;display:flex;flex-direction:column;gap:0}
  .controls{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--stage);border-bottom:1px solid var(--border)}
  .controls h1,.controls p,.controls .ctl-label{display:none}
  .controls .ctl-group{flex:1 1 140px}
  .ctl-seg button{min-height:34px;font-size:12px}
  .ctl-reset{min-height:34px}
  .phone{width:100%;height:auto;flex:1;min-height:0;border-radius:0;padding:0;background:none;box-shadow:none}
  .screen{border-radius:0}
  .statusbar{display:none}
}

/* ===== App chrome ===== */
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:24px}
.view::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px 22px;position:relative;z-index:5}
@media (max-width:760px){.tabbar{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--text-3);position:relative;border-radius:12px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .tab-ic{background:var(--primary-tint)}
.tab-ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--on-danger);font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:800}

.pad{padding:0 16px}
.lt-head{padding:8px 16px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lt-head h1{font-size:28px;line-height:34px;font-weight:800;margin:0;letter-spacing:-.01em}
.lt-head .sub{font-size:14px;color:var(--text-2);font-weight:600}
.navbar{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:4px;padding:4px 8px;min-height:56px}
.navbar .title{flex:1;text-align:center;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn:active{background:var(--surface-alt)}
.icon-btn.ghost{color:var(--primary)}

.section{margin-top:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;margin-bottom:12px}
.sec-head h2{font-size:18px;line-height:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.sec-head .link{font-size:14px;font-weight:700;color:var(--primary);min-height:40px;display:flex;align-items:center}
.count{min-width:22px;height:22px;border-radius:11px;background:var(--warning-tint);color:var(--warning-text);font-size:12px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.overline{font-size:12px;line-height:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);border:1px solid var(--card-border)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--text-2)}
.small{font-size:14px;line-height:20px}
.xs{font-size:13px;line-height:18px}
.b{font-weight:700}
.bb{font-weight:800}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tap{cursor:pointer;transition:transform .12s}
.tap:active{transform:scale(.985)}

/* Pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.pill.ok{background:var(--success-tint);color:var(--success-text)}
.pill.warn{background:var(--warning-tint);color:var(--warning-text)}
.pill.bad{background:var(--danger-tint);color:var(--danger-text)}
.pill.info{background:var(--primary-tint);color:var(--primary)}
.pill.neutral{background:var(--neutral-tint);color:var(--text-2)}
.pill.admin{background:var(--primary-tint);color:var(--primary);height:22px;font-size:12px;padding:0 8px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 16px;margin:0}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--on-chip-on)}
.chip .n{font-size:12px;opacity:.8}

/* Buttons */
.btn{min-height:48px;padding:0 16px;border-radius:var(--r-md);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98);filter:brightness(.94)}
.btn.lg{min-height:56px;font-size:16px;padding:0 20px;border-radius:14px}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:10px;position:relative}
.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn.block{width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.positive{background:var(--success);color:var(--on-success)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border-strong)}
.btn.quiet{color:var(--primary);padding:0 8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

/* Avatars */
.av{--h:210;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--av-fs) var(--av-fl));flex:none;letter-spacing:.02em}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:22px}
.av-stack{display:flex}
.av-stack .av{box-shadow:0 0 0 2px var(--surface);margin-left:-8px}
.av-stack .av:first-child{margin-left:0}

/* Group tile */
.gtile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.gtile.sm{width:32px;height:32px;border-radius:10px}
.gtile.lg{width:56px;height:56px;border-radius:16px}
.acc-blue{background:var(--acc-blue-t);color:var(--acc-blue)}
.acc-plum{background:var(--acc-plum-t);color:var(--acc-plum)}
.acc-clay{background:var(--acc-clay-t);color:var(--acc-clay)}
.acc-teal{background:var(--acc-teal-t);color:var(--acc-teal)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.acc-blue{background:var(--acc-blue)}.dot.acc-plum{background:var(--acc-plum)}.dot.acc-clay{background:var(--acc-clay)}.dot.acc-teal{background:var(--acc-teal)}

/* Home */
.greet{padding:8px 16px 16px;display:flex;align-items:center;gap:12px}
.greet .hello{font-size:26px;line-height:32px;font-weight:800;margin:0;letter-spacing:-.01em}
.hero{margin:0 16px;background:var(--navy);color:var(--on-navy);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(134,174,219,.22),transparent 70%);pointer-events:none}
.hero .overline{color:var(--on-navy-2)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .gname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--on-navy-2)}
.hero .gtile{background:rgba(255,255,255,.12);color:#fff}
.hero h3{font-size:30px;line-height:36px;font-weight:800;margin:14px 0 2px;letter-spacing:-.01em}
.hero .when{font-size:16px;font-weight:700}
.hero .when2{font-size:14px;color:var(--on-navy-2);margin-top:2px}
.hero .pill{background:rgba(255,255,255,.12);color:#fff}
.hero .pill.warn svg{color:var(--hero-amber)}
.hero .pill.ok svg{color:var(--hero-sage)}
.hero .pill.bad svg,.hero .pill.info svg{color:var(--hero-red)}
.hero .with{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--on-navy-2)}
.hero .av-stack .av{box-shadow:0 0 0 2px var(--navy)}
.hero .actions{display:flex;gap:10px;margin-top:20px;position:relative;z-index:1}
.hero .actions .btn{flex:1}
.btn.hero-yes{background:var(--hero-confirm);color:var(--on-hero-confirm)}
.btn.hero-no{background:var(--navy-raise);color:#fff}
.hero .done{margin-top:20px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:14px;line-height:20px;position:relative;z-index:1}
.hero .done .ck{width:32px;height:32px;border-radius:50%;background:var(--hero-confirm);color:var(--on-hero-confirm);display:grid;place-items:center;flex:none}
.hero-empty{margin:0 16px;padding:24px;text-align:center}

.att{display:flex;gap:12px;padding:14px 14px 14px 16px;position:relative;overflow:hidden}
.att::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.att.t-bad::before{background:var(--danger)}
.att.t-warn::before{background:var(--warning)}
.att.t-info::before{background:var(--primary)}
.att-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-bad .att-ic{background:var(--danger-tint);color:var(--danger-text)}
.t-warn .att-ic{background:var(--warning-tint);color:var(--warning-text)}
.t-info .att-ic{background:var(--primary-tint);color:var(--primary)}
.t-ok .att-ic{background:var(--success-tint);color:var(--success-text)}
.t-neutral .att-ic{background:var(--neutral-tint);color:var(--text-2)}
.att .ttl{font-weight:800;font-size:15px;line-height:21px}
.att .sub{font-size:14px;line-height:20px;color:var(--text-2);margin-top:2px}
.att .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.caught{display:flex;align-items:center;gap:10px;margin:0 16px;padding:14px 16px;border-radius:var(--r-lg);background:var(--success-tint);color:var(--success-text);font-weight:700;font-size:14px}

.gcard{padding:14px 14px 14px 14px;display:flex;align-items:center;gap:12px;min-height:72px}
.gcard .nm{font-weight:800;font-size:16px;line-height:22px}
.gcard .meta{font-size:14px;line-height:20px;color:var(--text-2)}
.gcard .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.issue{font-size:12px;font-weight:800;color:var(--warning-text);display:flex;align-items:center;gap:4px}
.chev{color:var(--text-3)}

.admin-box{margin:0 16px;padding:4px 0 0;}
.ahealth{padding:14px;display:flex;flex-direction:column;gap:12px}
.ahealth .top{display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-alt);font-size:13px;line-height:18px;font-weight:700;color:var(--text-2);min-height:40px}
.stat b{font-size:15px;color:var(--text)}
.stat.bad{background:var(--danger-tint);color:var(--danger-text)}.stat.bad b{color:var(--danger-text)}
.stat.warn{background:var(--warning-tint);color:var(--warning-text)}.stat.warn b{color:var(--warning-text)}
.stat.info{background:var(--primary-tint);color:var(--primary)}.stat.info b{color:var(--primary)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.quick .card{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:96px}

/* Lists */
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);border:1px solid var(--card-border);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.li+.li{border-top:1px solid var(--border)}
.li .t{font-weight:700;font-size:15px;line-height:21px}
.li .s{font-size:13px;line-height:18px;color:var(--text-2)}
.li-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-alt);color:var(--text-2);flex:none}

/* Segmented */
.seg{display:flex;background:var(--surface-alt);border-radius:12px;padding:3px;gap:2px;margin:0 16px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:700;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-selected="true"]{background:var(--border-strong)}}
:root[data-theme="dark"] .seg button[aria-selected="true"]{background:var(--border-strong)}

/* Schedule */
.week-h{padding:0 16px;margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.week-h h3{margin:0;font-size:15px;font-weight:800}
.week-h span{font-size:13px;color:var(--text-3);font-weight:700}
.sitem{display:flex;gap:14px;padding:14px;align-items:center}
.datebox{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--surface-alt);padding:6px 0}
.datebox .m{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.datebox .d{font-size:22px;line-height:26px;font-weight:800}
.datebox.me{background:var(--primary-tint);color:var(--primary)}
.datebox.me .m{color:var(--primary)}
.skipcard{border:1.5px dashed var(--border-strong);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--surface-alt) 70%,transparent) 10px 20px);border-radius:var(--r-lg);box-shadow:none}
.skipcard .datebox{background:transparent;border:1.5px dashed var(--border-strong);color:var(--text-3)}
.skipcard .datebox .d{text-decoration:line-through;text-decoration-thickness:2px}
.roles{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.rrow{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 0;font-size:14px}
.rrow .rn{width:96px;flex:none;color:var(--text-2);font-weight:600;font-size:13px}
.rrow .pn{flex:1;min-width:0;font-weight:700}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.sdot.ok{background:var(--success)}.sdot.warn{background:var(--warning)}.sdot.bad{background:var(--danger)}.sdot.info{background:var(--primary)}.sdot.neutral{background:var(--border-strong)}

/* Calendar */
.cal{margin:0 16px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head .mt{font-weight:800;font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding:4px 0}
.cday{aspect-ratio:1/1.05;min-height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:700;position:relative}
.cday.out{color:var(--text-3);opacity:.45}
.cday.today .num{box-shadow:0 0 0 2px var(--primary);border-radius:50%}
.cday .num{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.cday.mine .num{background:var(--primary);color:var(--on-primary)}
.cday.sel{background:var(--primary-tint)}
.cday .dots{display:flex;gap:2px;height:6px}
.cday .dots .dot{width:6px;height:6px}
.cday.skip .num{text-decoration:line-through;color:var(--text-3)}
.cday.skip::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--border-strong);border-radius:10px;pointer-events:none}
.cday.unav{background:repeating-linear-gradient(135deg,var(--danger-tint) 0 5px,transparent 5px 9px);color:var(--danger-text)}
.cday.pick .num{background:var(--danger);color:var(--on-danger)}
.cday.rangestart .num{box-shadow:0 0 0 2px var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 4px 2px;font-size:12px;font-weight:700;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:6px}
.lg-sw{width:14px;height:14px;border-radius:4px}

/* Group screen */
.ghead{padding:4px 16px 16px;display:flex;align-items:center;gap:14px}
.ghead h1{font-size:22px;line-height:28px;margin:0;font-weight:800}
.sticky-seg{position:sticky;top:56px;z-index:3;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:4px 0 10px}
.bar{height:8px;border-radius:4px;background:var(--surface-alt);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--primary)}
.bar .b2{background:color-mix(in srgb,var(--primary) 45%,transparent)}
.bar .b3{background:var(--success)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--border)}
.set-row .val{color:var(--text-2);font-weight:700;font-size:14px;text-align:right}
.switch{width:52px;height:32px;border-radius:16px;background:var(--border-strong);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.55;cursor:default}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--primary-tint);color:var(--text);font-size:14px;line-height:20px}
.note svg{color:var(--primary);margin-top:1px}
.note.warn{background:var(--warning-tint)}.note.warn svg{color:var(--warning-text)}
.note.bad{background:var(--danger-tint)}.note.bad svg{color:var(--danger-text)}
.note.ok{background:var(--success-tint)}.note.ok svg{color:var(--success-text)}

/* Detail */
.dhead{margin:0 16px;padding:20px}
.dhead h1{font-size:28px;line-height:34px;margin:12px 0 4px;font-weight:800}
.kv{display:flex;align-items:center;gap:12px;padding:12px 0}
.kv+.kv{border-top:1px solid var(--border)}
.kv .k{font-size:13px;color:var(--text-2);font-weight:700}
.kv .v{font-weight:700}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl{position:relative;padding:6px 0 10px}
.tl::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.tl.ok::before{border-color:var(--success);background:var(--success)}
.tl.bad::before{border-color:var(--danger);background:var(--danger)}
.tl.info::before{border-color:var(--primary);background:var(--primary)}
.tl.warn::before{border-color:var(--warning);background:var(--warning)}

/* Activity */
.act{display:flex;gap:12px;padding:14px 16px;position:relative}
.act+.act{border-top:1px solid var(--border)}
.act .txt{font-size:15px;line-height:21px}
.act .when{font-size:13px;color:var(--text-3);margin-top:3px;font-weight:600;display:flex;align-items:center;gap:6px}
.act .unread{position:absolute;right:16px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--primary)}

/* Sheet */
.sheet-layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.sheet-layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet-layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-3);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet-layer.open .sheet{transform:none}
.sheet.tall{height:92%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:8px auto 4px;flex:none}
.sheet-body{overflow-y:auto;padding:8px 20px 16px;flex:1}
.sheet-foot{padding:12px 20px 28px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex:none}
.sheet h2{font-size:22px;line-height:28px;margin:4px 0 6px;font-weight:800}
.field-label{font-size:13px;font-weight:800;color:var(--text-2);margin:20px 0 8px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--border-strong);background:var(--surface-alt);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--text);resize:none}
.steps{display:flex;gap:6px;margin:6px 0 10px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.steps i.on{background:var(--primary)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;min-height:60px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--primary)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.diff{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.diff .rn{width:84px;flex:none;color:var(--text-2);font-weight:600;font-size:13px}
.diff .old{color:var(--text-3);text-decoration:line-through;min-width:0}
.diff .new{font-weight:800;min-width:0}
.diff .arrow{color:var(--text-3)}
.me-hl{background:var(--warning-tint);color:var(--warning-text);border-radius:6px;padding:0 4px}
.qr{width:168px;height:168px;margin:16px auto;display:grid;grid-template-columns:repeat(21,1fr);padding:10px;background:#fff;border-radius:16px;border:1px solid var(--border)}
.qr i{background:#1F2D45}.qr b{background:transparent}

/* Toast */
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:30;background:var(--text);color:var(--bg);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;box-shadow:var(--shadow-2)}
.toast.show{opacity:1;transform:none}
@media (max-width:760px){.toast{bottom:96px}}
.fade-in{animation:fi .22s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.empty{padding:32px 24px;text-align:center;color:var(--text-2)}
.spacer{height:16px}

/* ===== v0.2 additions ===== */
.ctl-btns{display:flex;flex-direction:column;gap:6px}
.ctl-btn{min-height:40px;border-radius:10px;padding:0 12px;font-size:13px;font-weight:700;color:var(--stage-text);background:color-mix(in srgb,var(--stage-text) 8%,transparent);display:flex;align-items:center;gap:8px;text-align:left}
.ctl-btn:active{transform:scale(.98)}
@media (max-width:760px){.ctl-btns{flex-direction:row;flex-wrap:wrap;flex:1 1 100%}.ctl-btn{min-height:34px;font-size:12px}}
.mgcard{padding:14px;display:flex;flex-direction:column;gap:12px}
.mgcard .top{display:flex;align-items:center;gap:12px}
.stat.replace{background:var(--danger-tint);color:var(--danger-text)}
.debt{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--primary-tint);font-size:14px;line-height:20px}
.debt svg{color:var(--primary);margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--primary);background:var(--primary-tint);border-radius:6px;padding:1px 6px;margin-right:4px}
.or{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
/* Onboarding */
.onb-layer{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.onb-layer.open{display:flex}
.onb-top{display:flex;align-items:center;gap:8px;padding:56px 8px 8px;min-height:64px}
@media (max-width:760px){.onb-top{padding-top:8px}}
.onb-dots{flex:1;display:flex;justify-content:center;gap:6px}
.onb-dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .2s}
.onb-dots i.on{width:24px;background:var(--primary)}
.onb-body{flex:1;overflow-y:auto;padding:12px 24px 16px}
.onb-body h1{font-size:28px;line-height:34px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em}
.onb-body p.lead{font-size:16px;line-height:24px;color:var(--text-2);margin:0}
.onb-foot{padding:12px 24px 32px;display:flex;flex-direction:column;gap:8px}
.onb-hero{width:88px;height:88px;border-radius:26px;background:var(--navy);color:#fff;display:grid;place-items:center;margin:24px 0 28px;box-shadow:var(--shadow-2)}
.feat{display:flex;gap:14px;align-items:flex-start;padding:12px 0}
.feat .li-ic{background:var(--primary-tint);color:var(--primary)}
.choice{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-lg);border:1.5px solid var(--border);background:var(--surface);width:100%;text-align:left}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint)}
</style>
</head>

<div class="stage">
  <aside class="controls" aria-label="Prototype controls">
    <h1><span class="logo" id="logo"></span><span id="brandName">Rotaloop</span></h1>
    <p>Clickable draft (v0.2, approved domain model). Use these controls to see how the app adapts. Everything resets on reload.</p>
    <div class="ctl-group">
      <div class="ctl-label">Viewing as</div>
      <div class="ctl-seg" role="group" aria-label="Persona">

        <button data-ctl="theme" data-v="light">Light</button>
        <button data-ctl="theme" data-v="dark">Dark</button>
      </div>
    </div>
    <div class="ctl-group">
      <div class="ctl-label">Simulate</div>

      </div>
    </div>
    <button class="ctl-reset" data-ctl="reset">Reset demo data</button>
  </aside>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="island"></span><span class="sb-icons" id="sbIcons"></span></div>

    </div>
  </div>
</div>

const TODAY_ISO = '2026-11-19'; // a Thursday
const END_ISO = '2027-01-31';
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s,n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };
const daysUntil = s => Math.round((D(s) - D(TODAY_ISO)) / 86400000);
const fmt = (s, o) => D(s).toLocaleDateString('en-US', o);
const fShort = s => fmt(s, {weekday:'short', month:'short', day:'numeric'});
const fLong = s => fmt(s, {weekday:'long', month:'long', day:'numeric'});
const fMD = s => fmt(s, {month:'short', day:'numeric'});
function rel(s){
  const n = daysUntil(s);
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow';
  if (n === 7) return 'In 1 week'; if (n === 14) return 'In 2 weeks';
  if (n < 0) return `${-n} days ago`;
  return `In ${n} days`;
}

function groupDates(g){ const out = []; let d = g.start; while (D(d) <= D(END_ISO)) { out.push(d); d = addDays(d, g.interval); } return out; }
/* Rotation = queue per Responsibility. Turn k is the k-th non-skipped Event. Overrides (Time Off route-arounds,
   Make-up Turns) are keyed by turn number, so a Skip Date carries them forward with the turn. */
const personAt = (g, r, k) => S.overrides[`${g.id}|${r.id}|${k}`] || r.roster[k % r.roster.length];
function buildSchedule(g, skips){
  skips = skips || g.skips; let k = 0;
  return groupDates(g).map(date => {
    if (skips[date]) return {gid:g.id, date, skipped:true, reason:skips[date].reason, by:skips[date].by, slots:[]};
    const slots = g.roles.map(r => ({gid:g.id, date, roleId:r.id, k, person:personAt(g, r, k)}));
    k++;
    return {gid:g.id, date, skipped:false, slots};
  });
}
const role = (g, rid) => g.roles.find(r => r.id === rid);
const keyOf = sl => K(sl.gid, sl.date, sl.roleId, sl.person);
const OPEN = ['coverage','replace'];
function st(sl){
  const g = G(sl.gid), r = role(g, sl.roleId), o = S.slots[keyOf(sl)] || {};
  let status = o.status;
  if (!status) status = (r.confirm && daysUntil(sl.date) <= g.confirmWindow) ? 'pending' : r.confirm ? 'scheduled' : 'scheduled';
  if (!r.confirm && status === 'pending') status = 'scheduled';
  const assignee = o.guest ? null : (o.coveredBy || (OPEN.includes(status) ? null : sl.person));
  return Object.assign({}, o, {status, assignee});
}
function setSt(sl, patch, hist){
  const k = keyOf(sl); const cur = S.slots[k] || {};
  const history = (cur.history || []).concat(hist ? [].concat(hist) : []);
  S.slots[k] = Object.assign({}, cur, patch, {history});
}
function findSlot(k){ const p = k.split('|'); const g = G(p[0]); const day = buildSchedule(g).find(d => d.date === p[1]); return day && day.slots.find(s => s.roleId === p[2] && s.person === p[3]) || {gid:p[0], date:p[1], roleId:p[2], person:p[3], k:-1}; }
const upcoming = d => daysUntil(d) >= 0;
function allSchedules(){ return S.groups.map(g => ({g, days: buildSchedule(g)})); }
function myGroups(){ return S.groups.filter(g => membersOf(g).includes(ME)); }
function mySlots(includeDeclined){
  const out = [];
  for (const {days} of allSchedules()) for (const day of days) for (const sl of day.slots) {
    if (!upcoming(sl.date)) continue;
    const s = st(sl);
    if (s.assignee === ME || (includeDeclined && sl.person === ME && OPEN.includes(s.status))) out.push(sl);
  }
  return out.sort((a,b) => a.date.localeCompare(b.date));

function groupHealth(g){
  const days = buildSchedule(g).filter(d => upcoming(d.date));
  let coverage = 0, replace = 0, pending = 0;
  days.forEach(d => d.slots.forEach(sl => { const s = st(sl).status; if (s === 'coverage') coverage++; if (s === 'replace') replace++; if (s === 'pending' && daysUntil(sl.date) <= 21) pending++; }));
  const skips = days.filter(d => d.skipped);
  const changes = S.activity.filter(a => a.gid === g.id && a.kind === 'change' && a.day !== 'Earlier this week').length;
  const next = days.find(d => !d.skipped);
  return {coverage, replace, pending, skips, changes, next, issues: coverage + replace + pending};
}
function nextTurnOf(g, r, pid, afterDate){
  return buildSchedule(g).flatMap(d => d.slots).find(s => s.roleId === r.id && s.date > afterDate && s.person === pid && !OPEN.includes(st(s).status));
}
function makeupLine(debt, r){
  if (!debt) return '';
  const d = fMD(debt.payDate);
  if (isMe(debt.debtor)) return `You owe ${esc(first(debt.creditor))} a Make-up Turn: you’ll take ${esc(first(debt.creditor))}’s ${d} ${esc(r.name)} turn.`;
  if (isMe(debt.creditor)) return `${esc(first(debt.debtor))} owes you a Make-up Turn: they’ll take your ${d} ${esc(r.name)} turn.`;
  return `${esc(first(debt.debtor))} owes ${esc(first(debt.creditor))} a Make-up Turn (${d} ${esc(r.name)}).`;
}
/* Cover by a Group Member. Under Pay It Back the decliner takes the coverer's next turn in that Responsibility. */
function applyCover(sl, coverer, arrangedBy){
  const g = G(sl.gid), r = role(g, sl.roleId);
  let debt = null;
  if (g.settings.policy === 'payItBack' && coverer !== sl.person) {
    const t = nextTurnOf(g, r, coverer, sl.date);
    if (t) {
      S.overrides[`${g.id}|${r.id}|${t.k}`] = sl.person;
      debt = {debtor:sl.person, creditor:coverer, payDate:t.date, k:t.k};
      S.debts.push(Object.assign({gid:g.id, roleId:r.id, coverDate:sl.date}, debt));
      S.slots[K(g.id, t.date, r.id, sl.person)] = {status: r.confirm ? 'pending' : undefined, makeup:{creditor:coverer, coverDate:sl.date},
        history:[{t:'Just now', text:`Make-up Turn: ${pname(sl.person)} takes ${pname(coverer)}’s turn (Pay It Back)`, tone:'info'}]};
    }
  }
  const hist = [{t:'Just now', text:`Covered by ${pname(coverer)}${arrangedBy ? ` (arranged by ${pname(arrangedBy)})` : ''}`, tone:'info'}];
  if (arrangedBy && !r.roster.includes(coverer)) hist.push({t:'Just now', text:`${pname(coverer)} isn’t a Qualified Member for ${r.name}`, tone:''});
  if (arrangedBy) hist.push({t:'Just now', text:`${pname(coverer)} asked to confirm`, tone:'warn'});
  if (debt) hist.push({t:'Just now', text:`${pname(sl.person)} owes ${pname(coverer)} a Make-up Turn: ${fShort(debt.payDate)}`, tone:'info'});
  setSt(sl, {status:'covered', coveredBy:coverer, guest:null, debt}, hist);
  return debt;
}

/* ---------- SCHEDULE TAB ---------- */
function weekLabel(ws){
  const n = Math.round((D(ws) - D(weekKey(TODAY_ISO))) / 86400000);
  if (n === 0) return 'This week'; if (n === 7) return 'Next week';
  return 'Week of ' + fMD(ws);
}
function weekKey(date){ return addDays(date, -D(date).getDay()); }
function datebox(date, me){ return `<div class="datebox ${me?'me':''}"><div class="m">${fmt(date,{month:'short'})}</div><div class="d">${D(date).getDate()}</div></div>`; }
function schedItemsMine(){
  const items = [];
  mySlots(true).forEach(sl => items.push({date:sl.date, kind:'slot', sl}));
  myGroups().forEach(g => buildSchedule(g).filter(d => d.skipped && upcoming(d.date)).forEach(d => items.push({date:d.date, kind:'skip', g, d})));
  return items.sort((a,b) => a.date.localeCompare(b.date) || (a.kind==='skip'?1:-1));
}
function skipCard(g, d){

}
function mySlotCard(sl){

    <div class="grow"><div class="b">${s.makeup?'<span class="tag">Make-up Turn</span>':''}${esc(r.name)}</div><div class="small muted ellip"><span class="dot ${g.acc}" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>${esc(g.name)}</div>
    <div style="margin-top:8px">${pill(s.status, lbl)}</div></div><span class="chev">${ic('chevR',20)}</span></div>`;
}
function dayGroupCard(g, d){

  return `<div class="card" style="padding:14px"><div class="row tap" data-a="open-group" data-g="${g.id}" role="button" tabindex="0">${datebox(d.date, meIn)}<div class="grow"><div class="b ellip">${esc(g.name)}</div><div class="xs muted">${fShort(d.date)}</div></div><span class="chev">${ic('chevR',18)}</span></div>

    <span class="sdot ${STATUS[s.status].cls}" title="${STATUS[s.status].label}"></span></div>`;

function screenSchedule(){

  const top = `<div class="lt-head"><div><h1>Schedule</h1><div class="sub">${sc.scope==='me'?'Your Assignments':'All your groups'}</div></div>
      <button class="icon-btn ghost" data-a="open-availability" aria-label="Time Off">${ic('calOff',24)}</button></div>
    <div class="seg" role="tablist"><button role="tab" aria-selected="${sc.view==='list'}" data-a="sched-view" data-v="list">${ic('list',18)}List</button><button role="tab" aria-selected="${sc.view==='month'}" data-a="sched-view" data-v="month">${ic('grid',18)}Month</button></div>

function schedList(){
  const sc = S.sched; const weeks = new Map();
  const add = (date, html) => { const wk = weekKey(date); if (!weeks.has(wk)) weeks.set(wk, []); weeks.get(wk).push(html); };
  if (sc.scope === 'me') schedItemsMine().forEach(it => add(it.date, it.kind === 'skip' ? skipCard(it.g, it.d) : mySlotCard(it.sl)));
  else {
    const all = [];
    myGroups().forEach(g => buildSchedule(g).filter(d => upcoming(d.date)).forEach(d => all.push({g, d})));
    all.sort((a,b) => a.d.date.localeCompare(b.d.date)).forEach(({g,d}) => add(d.date, dayGroupCard(g, d)));
  }
  if (!weeks.size) return `<div class="empty">Nothing scheduled.</div>`;
  return [...weeks.entries()].map(([wk, cards]) => `<div class="week-h"><h3>${weekLabel(wk)}</h3><span>${fMD(wk)} – ${fMD(addDays(wk,6))}</span></div><div class="stack pad">${cards.join('')}</div>`).join('');
}
function monthCells(ym){
  const [y,m] = ym.split('-').map(Number); const firstD = new Date(y, m-1, 1); const start = addDays(iso(firstD), -firstD.getDay());
  const cells = []; for (let i = 0; i < 42; i++) { const d = addDays(start, i); cells.push({date:d, out: D(d).getMonth() !== m-1}); }
  while (cells.length > 35 && cells.slice(-7).every(c => c.out)) cells.splice(-7);
  return cells;
}
const shiftMonth = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const monthTitle = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long', year:'numeric'}); };
function dayInfo(date){
  const groups = [], mine = [], skips = [];
  myGroups().forEach(g => { const d = buildSchedule(g).find(x => x.date === date); if (!d) return;
    if (d.skipped) { skips.push({g,d}); return; }
    groups.push({g,d}); d.slots.forEach(sl => { if (st(sl).assignee === ME) mine.push(sl); }); });

}
function schedMonth(){
  const sc = S.sched; const cells = monthCells(sc.month);
  const grid = cells.map(c => {
    const inf = dayInfo(c.date);
    const cls = ['cday', 'tap', c.out?'out':'', c.date===TODAY_ISO?'today':'', inf.mine.length?'mine':'', (!inf.groups.length && inf.skips.length)?'skip':'', sc.sel===c.date?'sel':''].join(' ');
    const dots = sc.scope === 'me' ? inf.mine.map(sl => `<i class="dot ${G(sl.gid).acc}"></i>`).join('') : inf.groups.map(x => `<i class="dot ${x.g.acc}"></i>`).join('');
    return `<button class="${cls}" data-a="cal-pick" data-d="${c.date}" aria-label="${fLong(c.date)}"><span class="num">${D(c.date).getDate()}</span><span class="dots">${dots}</span></button>`;
  }).join('');
  let detail = '';
  const sel = sc.sel;
  if (sel) {
    const inf = dayInfo(sel); const cards = [];
    if (sc.scope === 'me') mySlots(true).filter(sl => sl.date === sel).forEach(sl => cards.push(mySlotCard(sl)));

    detail = `<div class="week-h"><h3>${fLong(sel)}</h3><span>${rel(sel)}</span></div><div class="stack pad">${cards.join('') || `<div class="empty card">Nothing on this day.</div>`}</div>`;

    <div class="cal-grid">${['S','M','T','W','T','F','S'].map(x => `<div class="cal-dow">${x}</div>`).join('')}${grid}</div>
    <div class="legend"><span><i class="lg-sw" style="background:var(--primary);border-radius:50%"></i>You’re serving</span><span><i class="lg-sw" style="border:1.5px dashed var(--border-strong)"></i>Skip Date</span>${myGroups().map(g => `<span><i class="dot ${g.acc}"></i>${esc(short(g))}</span>`).join('')}</div></div>${detail}`;

/* ---------- TIME OFF ---------- */
function timeOffDates(){ const set = new Set(); S.timeOff.forEach(t => t.dates.forEach(d => set.add(d))); return set; }
function expandRepeat(dates, repeat){
  if (repeat === 'none' || !dates.length) return dates.slice();
  const step = repeat === 'weekly' ? 7 : repeat === 'biweekly' ? 14 : 0;
  const out = new Set(dates);
  dates.forEach(d0 => { let d = d0; for (let i = 0; i < 12; i++) { if (step) d = addDays(d, step); else { const x = D(d); x.setMonth(x.getMonth()+1); d = iso(x); } if (D(d) > D(END_ISO)) break; out.add(d); } });
  return [...out].sort();
}
function myRoleNames(){ const set = new Set(); myGroups().forEach(g => g.roles.forEach(r => { if (r.roster.includes(ME)) set.add(r.name); })); return [...set]; }
function availConflicts(){
  const a = S.avail; const dates = new Set(expandRepeat(a.sel, a.repeat));
  return mySlots(false).filter(sl => dates.has(sl.date) && (a.scope.includes('all') || a.scope.includes(role(G(sl.gid), sl.roleId).name)));
}
/* Route around: the next in line takes the Event; you take their next turn and keep your place at the front. */
function routePlan(){
  const off = new Set(expandRepeat(S.avail.sel, S.avail.repeat)); const used = new Set();
  return availConflicts().map(sl => {
    const g = G(sl.gid), r = role(g, sl.roleId);
    if (g.settings.timeOff === 'ask') return {sl, mode:'ask'};
    const days = buildSchedule(g); const ev = days.find(d => d.date === sl.date);
    const cand = days.flatMap(d => d.slots).find(s => {
      if (s.roleId !== r.id || s.date <= sl.date || s.person === ME || off.has(s.date) || used.has(keyOf(s))) return false;
      if (!g.settings.allowDouble) {
        if (ev.slots.some(o => o.roleId !== r.id && o.person === s.person)) return false;
        const ev2 = days.find(d => d.date === s.date); if (ev2.slots.some(o => o.roleId !== r.id && o.person === ME)) return false;
      }
      return true;
    });
    if (!cand) return {sl, mode:'ask'};
    used.add(keyOf(cand));
    return {sl, mode:'route', other:cand};
  });
}
function screenAvailability(){

  </div>

    <div class="cal-grid">${['S','M','T','W','T','F','S'].map(x => `<div class="cal-dow">${x}</div>`).join('')}${grid}</div>
    <div class="legend"><span><i class="lg-sw" style="background:var(--danger)"></i>Selected</span><span><i class="lg-sw" style="background:repeating-linear-gradient(135deg,var(--danger-tint) 0 3px,transparent 3px 6px);border:1px solid var(--danger-tint)"></i>Already off</span><span><i class="dot" style="background:var(--primary)"></i>You’re serving</span></div>
    ${a.mode==='range' ? `<div class="xs muted b" style="padding:6px 4px 0">${a.rangeStart ? 'Now tap the last day of the range.' : 'Tap the first day, then the last day.'}</div>` : ''}

    <div class="field-label">Applies to</div><div class="chips">${scopeChips.map(([v,l]) => `<button class="chip" aria-pressed="${a.scope.includes(v)}" data-a="avail-scope" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>

    ${plan.length ? `<div class="note warn" style="margin-top:16px">${ic('route',20)}<div class="grow"><b>You’re scheduled on ${plan.length===1?'this day':'these days'}. Saving will:</b><ul style="margin:6px 0 0;padding-left:18px">${planHtml}</ul><div class="xs" style="margin-top:6px">Everyone affected is notified and asked to confirm again.</div></div></div>` : ''}
    <div class="btn-row" style="margin-top:16px"><button class="btn secondary" data-a="avail-clear" ${a.sel.length?'':'disabled'}>Clear</button><button class="btn primary" data-a="avail-save" ${a.sel.length?'':'disabled'}>Save${nDays ? ` ${nDays} day${nDays>1?'s':''}` : ''}</button></div>
    <div class="field-label" style="margin-top:28px">Your Time Off</div>
    <div class="list">${S.timeOff.length ? S.timeOff.map(t => `<div class="li"><span class="li-ic" style="background:var(--danger-tint);color:var(--danger-text)">${ic('calOff',20)}</span><div class="grow"><div class="t">${esc(t.label)}</div><div class="s">${t.scope.includes('all')?'All Responsibilities':esc(t.scope.join(', '))}${t.note?` · ${esc(t.note)}`:''}</div></div><button class="icon-btn" data-a="avail-remove" data-id="${t.id}" aria-label="Remove">${ic('trash',20)}</button></div>`).join('') : '<div class="empty">No Time Off yet</div>'}</div>

function sheetWrap(body, foot, tall){

function skipPreview(g, date, reason){
  const before = buildSchedule(g), after = buildSchedule(g, Object.assign({}, g.skips, {[date]:{reason}}));
  const out = []; const affected = new Set();
  for (let i = 0; i < before.length && out.length < 5; i++) {
    const b = before[i], a = after[i];
    if (b.date < date || b.skipped) continue;
    const rows = g.roles.map(r => {
      const bp = (b.slots.find(s => s.roleId === r.id) || {}).person, ap = (a.slots.find(s => s.roleId === r.id) || {}).person;
      if (bp !== ap) { if (bp) affected.add(bp); if (ap) affected.add(ap); }
      return {r, bp, ap};
    });
    out.push({date: b.date, rows, skip: a.skipped});
  }
  return {out, affected};
}
/* After a Skip Date is added/removed, every Assignment whose date changed resets to needing confirmation. */
function markMoved(g, before, after, why){
  const prevDate = {}; before.forEach(d => d.slots.forEach(s => { prevDate[`${s.roleId}|${s.k}`] = {date:d.date, person:s.person}; }));
  after.forEach(d => d.slots.forEach(s => {
    const p = prevDate[`${s.roleId}|${s.k}`]; if (!p || p.date === d.date) return;
    const r = role(g, s.roleId);
    S.slots[keyOf(s)] = {status: r.confirm ? 'pending' : undefined, moved:`Moved from ${fShort(p.date)} because ${why}`, history:[{t:'Just now', text:`Moved from ${fShort(p.date)}: ${why}`, tone:'warn'}]};
  }));
}

  if (S.tab === 'activity' && !top) setTimeout(() => { S.activity.forEach(a => a.unread = false); renderTabbar(); }, 1200);
  document.querySelectorAll('[data-ctl="persona"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.persona));
}
function closeSheet(){
  const layer = document.getElementById('sheetLayer'); layer.classList.remove('open');
  S.sheet = null; setTimeout(() => { if (!S.sheet) layer.innerHTML = ''; }, 300);
}
function push(route){ S.stack.push(route); render(); }

/* ============================================================
   Actions
   ============================================================ */
function cycle(arr, cur){ return arr[(arr.indexOf(cur) + 1) % arr.length]; }
const A = {
  tab(el){ S.tab = el.dataset.v; S.stack = []; render(); },
  back(){ S.stack.pop(); render(); },
  'open-assignment'(el){ push({name:'assignment', k:el.dataset.k}); },
  'open-group'(el){ push({name:'group', g:el.dataset.g, tab:'overview'}); },
  'open-availability'(){ push({name:'availability'}); },
  'group-tab'(el){ S.stack[S.stack.length-1].tab = el.dataset.v; render(true); },
  toast(el){ toast(el.dataset.msg, 'info'); },
  confirm(el){
    const sl = findSlot(el.dataset.k), g = G(sl.gid), r = role(g, sl.roleId);
    setSt(sl, {status:'confirmed'}, {t:'Just now', text:`${pname(ME)} confirmed`, tone:'ok'});
    log(g.id, 'checkCircle', 'ok', 'confirm', `<b>You</b> confirmed <b>${esc(r.name)}</b> for ${fShort(sl.date)}.`);
    toast(`Confirmed ${r.name} for ${fShort(sl.date)}. Thank you!`); render(true);
  },
  decline(el){ S.sheet = {type:'decline', k:el.dataset.k, reason:null, note:''}; render(true); },
  'decline-reason'(el){ S.sheet.reason = S.sheet.reason === el.dataset.v ? null : el.dataset.v; S.sheet._keep = true; render(true); },
  'decline-submit'(){
    const sh = S.sheet, sl = findSlot(sh.k), g = G(sl.gid), r = role(g, sl.roleId), s = st(sl);
    const reason = [sh.reason, sh.note].filter(Boolean).join(': ');
    const notified = r.roster.filter(p => p !== ME);
    const hist = [{t:'Just now', text:`You declined${reason?`: “${reason}”`:''}`, tone:'bad'}, {t:'Just now', text:`Coverage Request sent to ${notified.map(first).join(', ')}`, tone:'warn'}];
    if (s.makeup) {
      hist.push({t:'Just now', text:`Make-up Turn owed to ${pname(s.makeup.creditor)} is settled; you’ll owe whoever covers`, tone:'info'});
      S.debts.forEach(d => { if (d.gid === g.id && d.debtor === ME && d.payDate === sl.date && d.roleId === r.id) d.cancelled = true; });
    }
    setSt(sl, {status:'coverage', reason, notified, coveredBy:null, guest:null}, hist);
    log(g.id, 'repeat', 'bad', 'coverage', `<b>You</b> can’t make <b>${esc(r.name)}</b> on ${fShort(sl.date)}. Coverage Request sent to ${notified.length} people.`);
    closeSheet();
    const top = S.stack[S.stack.length-1];
    if (!top || top.name !== 'assignment') S.stack.push({name:'assignment', k:sh.k});
    render(); toast(`Coverage Request sent to ${notified.length} people.`, 'send');
  },
  'undo-decline'(el){
    const sl = findSlot(el.dataset.k), g = G(sl.gid), r = role(g, sl.roleId);
    setSt(sl, {status:'confirmed', reason:null, notified:[]}, {t:'Just now', text:'You can make it after all; Coverage Request withdrawn', tone:'ok'});
    log(g.id, 'checkCircle', 'ok', 'confirm', `<b>You</b> can make <b>${esc(r.name)}</b> on ${fShort(sl.date)} after all. Coverage Request withdrawn.`);
    toast('You’re back on. Coverage Request withdrawn.'); render(true);
  },
  cover(el){ S.sheet = {type:'cover', k:el.dataset.k}; render(true); },
  'cover-submit'(){
    const sl = findSlot(S.sheet.k), g = G(sl.gid), r = role(g, sl.roleId);
    const debt = applyCover(sl, ME);
    log(g.id, 'repeat', 'info', 'coverage', `<b>You</b> are covering <b>${esc(r.name)}</b> for ${esc(first(sl.person))} on ${fShort(sl.date)}.${debt?` ${esc(first(sl.person))} owes you a Make-up Turn: ${fShort(debt.payDate)}.`:''}`);
    closeSheet(); render(true); toast(`You’re covering ${r.name} on ${fShort(sl.date)}.${debt ? ` ${first(sl.person)} takes your ${fMD(debt.payDate)} turn.` : ''}`);
  },
  'mark-covered'(el){ S.sheet = {type:'mark', k:el.dataset.k, guest:''}; render(true); },
  'mark-pick'(el){
    const sl = findSlot(S.sheet.k), g = G(sl.gid), r = role(g, sl.roleId), p = el.dataset.v;
    const debt = applyCover(sl, p, ME);
    log(g.id, 'userCheck', 'info', 'coverage', `<b>${esc(pname(p))}</b> is covering <b>${esc(r.name)}</b> on ${fShort(sl.date)} (arranged by you).${debt?` ${esc(isMe(sl.person)?'You owe':first(sl.person)+' owes')} ${esc(first(p))} a Make-up Turn: ${fShort(debt.payDate)}.`:''}`);
    closeSheet(); render(true); toast(`${pname(p)} is covering. They’ve been asked to confirm.`);
  },
  'mark-guest'(){
    const name = (S.sheet.guest || '').trim(); if (!name) { toast('Type the guest’s name first', 'info'); return; }
    const sl = findSlot(S.sheet.k), g = G(sl.gid), r = role(g, sl.roleId);
    setSt(sl, {status:'covered', coveredBy:null, guest:name, debt:null}, {t:'Just now', text:`Covered by ${name} (guest), recorded by ${pname(ME)}. No workload, no Make-up Turn.`, tone:'info'});
    log(g.id, 'userCheck', 'info', 'coverage', `<b>${esc(r.name)}</b> on ${fShort(sl.date)} is covered by ${esc(name)} (guest).`);
    closeSheet(); render(true); toast(`Covered by ${name} (guest).`);
  },
  'sheet-close'(){ closeSheet(); },
  'dismiss-notice'(el){ S.notices = S.notices.filter(n => n.id !== el.dataset.id); render(true); },
  'home-filter'(el){ S.homeFilter = el.dataset.v; render(true); },
  'sched-view'(el){ S.sched.view = el.dataset.v; render(true); },
  'sched-scope'(el){ S.sched.scope = el.dataset.v; render(true); },
  'cal-move'(el){ S.sched.month = shiftMonth(S.sched.month, +el.dataset.v); S.sched.sel = null; render(true); },
  'cal-pick'(el){ S.sched.sel = el.dataset.d; render(true); },
  invite(el){ S.sheet = {type:'invite', g:el.dataset.g}; render(true); },
  'copy-link'(){ toast('Invite link copied'); },
  'skip-open'(el){ S.sheet = {type:'skip', g:el.dataset.g, step:1, date:null, reason:null, note:''}; render(true); },
  'skip-date'(el){ S.sheet.date = el.dataset.v; S.sheet._keep = true; render(true); },
  'skip-reason'(el){ S.sheet.reason = el.dataset.v; S.sheet._keep = true; render(true); },
  'skip-next'(){ S.sheet.step++; S.sheet._keep = false; render(true); },
  'skip-back'(){ S.sheet.step--; S.sheet._keep = false; render(true); },
  'skip-confirm'(){
    const sh = S.sheet, g = G(sh.g), reason = sh.note || sh.reason;
    const {affected} = skipPreview(g, sh.date, reason);
    const before = buildSchedule(g);
    g.skips[sh.date] = {reason, by:ME};
    markMoved(g, before, buildSchedule(g), `${fShort(sh.date)} became a Skip Date`);
    log(g.id, 'calX', 'neutral', 'change', `<b>You</b> added a Skip Date on <b>${fShort(sh.date)}</b>: “${esc(reason)}.” ${affected.size} people moved forward one Event and were asked to confirm again.`);
    closeSheet(); render(true); toast(`${fShort(sh.date)} is a Skip Date. ${affected.size} people notified.`, 'calX');
  },
  unskip(el){
    const g = G(el.dataset.g), d = el.dataset.d; const before = buildSchedule(g);
    delete g.skips[d];
    markMoved(g, before, buildSchedule(g), `the Skip Date on ${fShort(d)} was removed`);
    log(g.id, 'undo', 'info', 'change', `<b>You</b> removed the Skip Date on <b>${fShort(d)}</b>. Rotation restored; affected people were asked to confirm again.`);
    render(true); toast('Skip Date removed. Rotation restored.', 'undo');
  },
  'set-toggle'(el){ const g = G(el.dataset.g); g.settings[el.dataset.v] = !g.settings[el.dataset.v]; render(true); },
  'role-confirm'(el){ const g = G(el.dataset.g), r = role(g, el.dataset.v); r.confirm = !r.confirm; render(true); },
  'set-cycle'(el){
    const g = G(el.dataset.g), key = el.dataset.v, opts = {policy:Object.keys(POLICY), duty:Object.keys(DUTY), timeOff:Object.keys(TIMEOFF)}[key];
    g.settings[key] = cycle(opts, g.settings[key]);
    if (key === 'policy' && g.settings.policy === 'countRealWork') {
      const open = S.debts.filter(d => d.gid === g.id && !d.cancelled);
      open.forEach(d => { d.cancelled = true; delete S.overrides[`${g.id}|${d.roleId}|${d.k}`]; delete S.slots[K(g.id, d.payDate, d.roleId, d.debtor)];
        const cov = buildSchedule(g).flatMap(x => x.slots).find(s => s.date === d.coverDate && s.roleId === d.roleId && s.person === d.debtor);
        if (cov) setSt(cov, {debtCancelled:true}, {t:'Just now', text:'Make-up Turn cancelled: Coverage Policy switched to Count Real Work', tone:''}); });
      log(g.id, 'scale', 'info', 'change', `<b>You</b> switched ${esc(g.name)} to <b>Count Real Work</b>.${open.length?` ${open.length} outstanding Make-up ${open.length===1?'Turn was':'Turns were'} cancelled.`:''}`);
    } else if (key === 'policy') log(g.id, 'scale', 'info', 'change', `<b>You</b> switched ${esc(g.name)} to <b>Pay It Back</b>. It starts with no debts.`);
    render(true);
  },
  'avail-mode'(el){ S.avail.mode = el.dataset.v; S.avail.rangeStart = null; render(true); },
  'avail-move'(el){ S.avail.month = shiftMonth(S.avail.month, +el.dataset.v); render(true); },
  'avail-day'(el){
    const a = S.avail, d = el.dataset.d;
    if (a.mode === 'single') a.sel = a.sel.includes(d) ? a.sel.filter(x => x !== d) : a.sel.concat(d).sort();
    else if (!a.rangeStart) { a.rangeStart = d; a.sel = [d]; }
    else { const [s, e] = [a.rangeStart, d].sort(); const out = []; for (let x = s; x <= e; x = addDays(x,1)) out.push(x); a.sel = out; a.rangeStart = null; }
    render(true);
  },
  'avail-repeat'(el){ S.avail.repeat = el.dataset.v; render(true); },
  'avail-scope'(el){
    const a = S.avail, v = el.dataset.v;
    if (v === 'all') a.scope = ['all'];
    else { a.scope = a.scope.filter(x => x !== 'all'); a.scope = a.scope.includes(v) ? a.scope.filter(x => x !== v) : a.scope.concat(v); if (!a.scope.length) a.scope = ['all']; }
    render(true);
  },
  'avail-clear'(){ S.avail.sel = []; S.avail.rangeStart = null; render(true); },
  'avail-save'(){
    const a = S.avail; const dates = expandRepeat(a.sel, a.repeat); const plan = routePlan();
    const rep = {none:'', weekly:', repeats weekly', biweekly:', every other week', monthly:', monthly'}[a.repeat];
    const label = (dates.length === 1 ? fShort(dates[0]) : a.mode === 'range' && a.repeat==='none' ? `${fShort(dates[0])} – ${fShort(dates[dates.length-1])}` : `${dates.length} days from ${fShort(dates[0])}`) + rep;
    S.timeOff.push({id:'t'+Date.now(), label, dates, repeat:a.repeat, scope:a.scope.slice(), note:a.note});
    const lines = [];
    plan.forEach(p => {
      const sl = p.sl, g = G(sl.gid), r = role(g, sl.roleId);
      if (p.mode === 'route') {
        const o = p.other;
        S.overrides[`${g.id}|${r.id}|${sl.k}`] = o.person; S.overrides[`${g.id}|${r.id}|${o.k}`] = ME;
        const st1 = r.confirm ? 'pending' : undefined;
        S.slots[K(g.id, sl.date, r.id, o.person)] = {status:st1, moved:`Moved from ${fShort(o.date)} because ${first(ME)} has Time Off on ${fShort(sl.date)}`, history:[{t:'Just now', text:`Routed around Time Off: ${pname(o.person)} takes this Event (was ${fShort(o.date)})`, tone:'warn'}]};
        S.slots[K(g.id, o.date, r.id, ME)] = {status:st1, moved:`Moved from ${fShort(sl.date)} because of your Time Off`, history:[{t:'Just now', text:`Routed around Time Off: you take ${pname(o.person)}’s turn (was ${fShort(sl.date)})`, tone:'warn'}]};
        log(g.id, 'route', 'warn', 'change', `Routed around your Time Off: <b>${esc(pname(o.person))}</b> takes <b>${esc(r.name)}</b> on ${fShort(sl.date)}, and you take their turn on ${fShort(o.date)}. Both of you were notified.`);
        lines.push(`<b>${esc(r.name)}:</b> ${esc(first(o.person))} takes ${fShort(sl.date)}; you take ${fShort(o.date)}. Both of you were notified and asked to confirm.`);
      } else {
        const notified = r.roster.filter(x => x !== ME);
        setSt(sl, {status:'coverage', reason:'Time Off', notified}, {t:'Just now', text:'You have Time Off; Coverage Request sent', tone:'bad'});
        log(g.id, 'calOff', 'warn', 'coverage', `<b>You</b> have Time Off on ${fShort(sl.date)}. Coverage Request sent for <b>${esc(r.name)}</b>.`);
        lines.push(`<b>${esc(r.name)}, ${fShort(sl.date)}:</b> Coverage Request sent.`);
      }
    });
    if (lines.length) S.notices.push({id:'n'+Date.now(), icon:'route', title:'Time Off saved, schedule adjusted', html:lines.join('<br>')});
    S.avail = {mode:a.mode, month:a.month, sel:[], rangeStart:null, repeat:'none', scope:['all'], note:''};
    render(true); toast(lines.length ? `Time Off saved. Routed around ${lines.length} Assignment${lines.length>1?'s':''}; see Home.` : 'Time Off saved. We’ll schedule around it.', 'route');
  },
  'avail-remove'(el){ S.timeOff = S.timeOff.filter(t => t.id !== el.dataset.id); render(true); toast('Time Off removed', 'trash'); },
  'act-filter'(el){ S.actFilter = el.dataset.v; render(true); },
  'pref-timing'(el){ const p = S.prefs, v = el.dataset.v; p.timing = p.timing.includes(v) ? p.timing.filter(x => x !== v) : p.timing.concat(v); render(true); },
  'pref-time'(el){ S.prefs.time = el.dataset.v; render(true); },
  'pref-toggle'(el){ S.prefs[el.dataset.v] = !S.prefs[el.dataset.v]; render(true); },
  'pref-alert'(){ S.prefs.alertLead = cycle(ALERT_OPTS, S.prefs.alertLead); render(true); },
  /* onboarding */
  'onb-next'(){ S.onb.step++; render(true); },
  'onb-back'(){ S.onb.step--; render(true); },
  'onb-close'(){ S.onb = null; render(true); },
  'onb-toggle'(el){ S.onb[el.dataset.v] = !S.onb[el.dataset.v]; render(true); },
  'onb-choice'(el){ S.onb.choice = el.dataset.v; render(true); },
  'onb-finish'(el){
    const o = S.onb;
    const full = [o.firstName.trim(), o.lastName.trim()].filter(Boolean).join(' ');
    if (full) PEOPLE[ME] = full;
    Object.assign(S.prefs, {push:o.push, email:o.email, sms:o.sms});
    S.onb = null; S.tab = 'home'; S.stack = []; render();
    toast(el.dataset.v === 'later' ? `Welcome, ${first(ME)}! Here’s a sample of what your Home looks like.` : o.choice === 'create' ? 'Group setup isn’t in this prototype; showing sample groups.' : 'Joined! (Prototype: showing sample groups.)', 'sparkle' in ICONS ? 'sparkle' : 'checkCircle');
  },
};

document.getElementById('screen').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el); }
});
document.getElementById('screen').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && S.sheet) closeSheet();
});
document.getElementById('screen').addEventListener('input', e => {
  const m = e.target.dataset.model; if (!m) return;
  const [obj, key] = m.split('.');
  if (obj === 'sheet' && S.sheet) S.sheet[key] = e.target.value;
  if (obj === 'avail') S.avail[key] = e.target.value;
  if (obj === 'onb' && S.onb) { S.onb[key] = e.target.value; const b = document.getElementById('onbNameNext'); if (b) b.disabled = !S.onb.firstName.trim(); }
});

/* Stage controls */
function setTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-ctl="theme"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === t));
  try { localStorage.setItem('rl-theme', t); } catch (_) {}
}
function simCover(){
  const mine = mySlots(true).filter(sl => st(sl).status === 'coverage' && sl.person === ME);
  if (!mine.length) { toast('First tap “Can’t make it” on one of your Assignments.', 'info'); return; }
  const sl = mine[0], g = G(sl.gid), r = role(g, sl.roleId);
  const ev = buildSchedule(g).find(d => d.date === sl.date);
  const who = r.roster.find(p => p !== ME && !ev.slots.some(x => x.roleId !== r.id && x.person === p));
  if (!who) { toast('No one Qualified is free for that Event.', 'info'); return; }
  const debt = applyCover(sl, who);
  log(g.id, 'repeat', 'info', 'coverage', `<b>${esc(pname(who))}</b> is covering your <b>${esc(r.name)}</b> on ${fShort(sl.date)}.${debt?` You owe ${esc(first(who))} a Make-up Turn: you’ll take ${esc(first(who))}’s ${fMD(debt.payDate)} turn.`:''}`);
  if (debt) S.notices.push({id:'n'+Date.now(), icon:'handshake', title:`${first(who)} is covering you`, html:`${esc(r.name)}, ${fShort(sl.date)}. ${makeupLine(debt, r)}`});
  render(true); toast(`${first(who)} is covering your ${r.name}.`, 'repeat');
}
function simAlert(){
  let n = 0;
  allSchedules().forEach(({g, days}) => days.forEach(d => d.slots.forEach(sl => { if (upcoming(sl.date) && st(sl).status === 'coverage') { n++;
    setSt(sl, {status:'replace'}, {t:'Just now', text:`Alert time reached with no taker. ${g.settings.duty==='admins'?'Admins are':pname(sl.person)+' is'} finding a replacement (Replacement Duty: ${DUTY[g.settings.duty][0]}).`, tone:'bad'});
    log(g.id, 'alert', 'bad', 'coverage', `Nobody volunteered for <b>${esc(role(g, sl.roleId).name)}</b> on ${fShort(sl.date)}. ${g.settings.duty==='admins'?'The Admins are':esc(isMe(sl.person)?'You’re':first(sl.person)+' is')} finding a replacement.`); } })));
  render(true); toast(n ? `${n} Coverage Request${n>1?'s':''} reached the alert time with no taker.` : 'No open Coverage Requests right now.', 'alert');
}
document.querySelector('.controls').addEventListener('click', e => {
  const b = e.target.closest('[data-ctl]'); if (!b) return;
  const c = b.dataset.ctl;
  if (c === 'persona') { S.persona = b.dataset.v; const top = S.stack[S.stack.length-1]; render(!!top); toast(S.persona === 'admin' ? 'Viewing as Admin of Sunday Worship Team and AV & Media' : 'Viewing as a regular Member', 'user'); }
  if (c === 'theme') setTheme(b.dataset.v);
  if (c === 'onboarding') openOnboarding();
  if (c === 'sim-cover') simCover();
  if (c === 'sim-alert') simAlert();
  if (c === 'reset') { const p = S.persona; PEOPLE = Object.assign({}, SEED_PEOPLE); S = initialState(); S.persona = p; closeSheet(); render(); toast('Demo data reset', 'undo'); }
});

/* Init. A plain #onboarding hash opens onboarding (survives sandboxed embeds). #key=value deep links are for local testing only. */
document.title = `${APP_NAME} Prototype`;
document.getElementById('brandName').textContent = APP_NAME;
document.getElementById('logo').innerHTML = ic('loop', 20, 2.2);
document.getElementById('ic-onb').innerHTML = ic('play', 16);
document.getElementById('ic-cov').innerHTML = ic('handshake', 16);
document.getElementById('ic-alr').innerHTML = ic('zap', 16);
document.getElementById('sbIcons').innerHTML = '<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.5a10 10 0 0 1 14 0"/><path d="M3.5 7.2a6.4 6.4 0 0 1 9 0"/><circle cx="8" cy="10.2" r="1" fill="currentColor"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".4"/></svg>';
(function init(){
  const raw = location.hash.slice(1);
  const h = new URLSearchParams(raw.includes('=') ? raw : '');
  let theme = 'auto'; try { theme = localStorage.getItem('rl-theme') || 'auto'; } catch (_) {}
  if (h.get('theme')) theme = h.get('theme');
  setTheme(theme);
  if (h.get('persona')) S.persona = h.get('persona');
  if (h.get('tab')) S.tab = h.get('tab');
  if (h.get('view')) S.sched.view = h.get('view');
  if (h.get('scope')) S.sched.scope = h.get('scope');
  if (h.get('group')) S.stack.push({name:'group', g:h.get('group'), tab:h.get('gtab') || 'overview'});
  if (h.get('screen') === 'availability') S.stack.push({name:'availability'});
  if (h.get('screen') === 'assignment') S.stack.push({name:'assignment', k:h.get('k') || K('worship','2026-11-29','lead','jordan')});
  if (h.get('sheet') === 'skip') S.sheet = {type:'skip', g:h.get('group') || 'worship', step:+(h.get('step')||1), date:h.get('date') || null, reason:h.get('step')>1?'Holiday':null, note:''};
  if (h.get('sheet') === 'mark') S.sheet = {type:'mark', k:K('hosp','2026-11-22','greeter','jordan'), guest:''};
  if (h.get('sheet') === 'cover') S.sheet = {type:'cover', k:K('hosp','2026-12-06','greeter','priya')};
  render();
  if (raw === 'onboarding' || h.get('onb')) { openOnboarding(); if (h.get('onb')) { S.onb.step = +h.get('onb'); render(); } }
})();
</script>
