<!--
  NOT IN USE. MVP sign-in is a guest account with no email (see the 2026-11-16 decision in
  .scratch/domain-grilling/decisions.md), and supabase/config.toml no longer references this
  file. Keep it for when custom SMTP exists ([auth.email.smtp]): the free Supabase tier rejects
  email template changes without it. To use it, add [auth.email.template.magic_link] and
  [auth.email.template.confirmation] sections pointing here, and set otp_length.

  Sign-in code email, used for both the magic_link and confirmation templates so new and
  returning users get the same 6-digit code (the app verifies it with verifyOtp, no links).
  "Rotaloop" is a working name: if APP_NAME in src/config/app.ts changes, update this file
  and the subjects in supabase/config.toml, then run `npx supabase config push`.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1F2D45; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="font-size: 22px; margin: 0 0 12px;">Your Rotaloop code</h2>
  <p style="font-size: 16px; line-height: 24px; margin: 0 0 16px;">Enter this code in the app to sign in:</p>
  <p style="font-size: 32px; font-weight: 800; letter-spacing: 6px; margin: 0 0 16px; padding: 12px 16px; background: #F3EEE6; border-radius: 12px; text-align: center;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 20px; color: #5F6673; margin: 0;">The code expires in 1 hour. If you didn't ask for it, you can ignore this email.</p>
</div>
